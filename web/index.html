<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/mewmory_icon_16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/mewmory_icon_32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/mewmory_icon_48.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/mewmory_icon_192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#141413" />
    <meta name="description" content="Mewmory - Smart vocabulary learning with AI assistance and spaced repetition" />
    <meta property="og:title" content="Mewmory - Vocabulary Learning" />
    <meta property="og:image" content="/mewmory_icon_512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mewmory - Vocabulary Learning</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("mewmory-theme");
          if (
            t === "dark" ||
            (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.dataset.theme = "dark";
          } else {
            document.documentElement.dataset.theme = "light";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
