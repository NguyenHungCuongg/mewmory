name: mewmory
description: Smart English vocabulary notebook
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  # Navigation
  go_router: ^18.0.1
  # Backend
  supabase_flutter: ^2.7.0
  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.4
  path: ^1.9.0
  # JSON
  json_annotation: ^4.9.0
  # Fonts
  google_fonts: ^8.2.1
  # Utilities
  connectivity_plus: ^7.3.1
  flutter_dotenv: ^6.0.1
  uuid: ^4.4.2
  url_launcher: ^6.3.0
  audioplayers: ^6.1.0
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^4.0.0+1
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - .env
