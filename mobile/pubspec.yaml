name: mewmory
description: Smart English vocabulary notebook
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Navigation
  go_router: ^14.2.7
  # Backend
  supabase_flutter: ^2.7.0
  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  # JSON
  json_annotation: ^4.9.0
  # Fonts
  google_fonts: ^6.2.1
  # Utilities
  connectivity_plus: ^6.0.5
  flutter_dotenv: ^5.1.0
  uuid: ^4.4.2
  url_launcher: ^6.3.0
  audioplayers: ^6.1.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  flutter_slidable: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.4

flutter:
  uses-material-design: true
  assets:
    - .env
